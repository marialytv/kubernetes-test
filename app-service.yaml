apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  labels:
    app: flask-app
spec:
  ports:
    - name: "5007"
      port: 5007            # The port the service listens on
      targetPort: 5007      # The port on the pod to which the traffic is forwarded
  selector:
    app: flask-app
  type: LoadBalancer